schema_version: 2
speaker_default: 王兴兴（宇树科技创始人、董事长兼 CEO）
quotes:
  '05':
    text: '“the biggest product ever”'
    source: 'Business Insider 综述报道里的马斯克原话'
    date: '2026-07-24'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://www.businessinsider.com/everything-we-know-about-teslas-optimus-humanoid-robot-2026-7'
    note: '本章从一颗关节往上数，数到“这台机器为什么值得做”；他那句“史上最大产品”是同一个问题的另一面。注意：这是愿景，不是任何参数。'
    source_short: '马斯克（第三方报道）'
  '07':
    text: '“Optimus will be an amazing surgeon in the future.”'
    source: '特斯拉 2025 年第三季度财报电话会议（36 氪英文版报道）'
    date: '2025-11-07'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://eu.36kr.com/en/p/3542648986251139'
    note: '本章讲三相旋转磁场怎么“合成”出来。手术级精度这句话没有技术含量，但它成立的前提正是本章那条：磁场方向必须能连续、任意、按微秒改。'
    source_short: '马斯克（第三方报道）'
  '09':
    text: '“agonizingly slow”'
    source: '马斯克就 Optimus 早期产能爬坡对投资者的警告（Business Insider 综述）'
    date: '2026-07-24'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://www.businessinsider.com/everything-we-know-about-teslas-optimus-humanoid-robot-2026-7'
    note: '本章算斩波与“平均”为什么合法。他那句“慢得痛苦”说的是产线不是环路——两者是同一个物理的两端：一个开关周期 50 µs，一台机器一年几百万个周期，慢的是把良率磨上去。'
    source_short: '马斯克（第三方报道）'
  '10':
    text: '“human and then superhuman dexterity”'
    source: '马斯克在财报电话会议上讲 Optimus 手部设计（Business Insider 综述）'
    date: '2026-07-24'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://www.businessinsider.com/everything-we-know-about-teslas-optimus-humanoid-robot-2026-7'
    note: '本章给的是延迟到带宽那条不等式。“先像人、再超人”的手，要的正是这条不等式留出的那点相位余量——手速不靠愿望提高。'
    source_short: '马斯克（第三方报道）'
  '11':
    text: '“$20,000 to $25,000”'
    source: '马斯克对量产规模下 Optimus 单台成本的估计（Business Insider 综述）'
    date: '2026-07-24'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://www.businessinsider.com/everything-we-know-about-teslas-optimus-humanoid-robot-2026-7'
    note: '本章把 Clarke 与 Park 两个变换推到底。成本能砍到这个量级，原因之一就是坐标变换让一颗通用伺服板同时管二十几颗关节——软件省掉了硬件。'
    source_short: '马斯克（第三方报道）'
  '12':
    text: '“Progress on Optimus hardware and software continued in Q4, including the latest generation hand, robust locomotion and training on additional tasks, ahead of planned pilot production in 2025.”'
    source: '特斯拉 2024 年第四季度股东更新（公司自己发布的 PDF，逐字抽取）'
    date: '2025-01-29'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 特斯拉自己发布的股东更新原文（PDF 全文用 PyMuPDF 抽取，逐字核对）
    url: 'https://digitalassets.tesla.com/tesla-contents/image/upload/IR/TSLA-Q4-2024-Update.pdf'
    note: '本章是三环带宽递减律。这句话把“手、走、练”并列——它们分别吃位置环、速度环、电流环的带宽。'
    source_short: '特斯拉股东更新'
  '18':
    text: '“We remain on track for pilot launch of Robotaxi in Austin by June and builds of Optimus on our Fremont pilot production line in 2025, with wider deployment of bots doing useful work across our factories.”'
    source: '特斯拉 2025 年第一季度股东更新（公司自己发布的 PDF，逐字抽取）'
    date: '2025-04-22'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 特斯拉自己发布的股东更新原文（PDF 全文用 PyMuPDF 抽取，逐字核对）
    url: 'https://digitalassets.tesla.com/tesla-contents/image/upload/IR/TSLA-Q1-2025-Update.pdf'
    note: '本章算刚度由三道天花板决定。“在工厂里做有用的活”的技术含义是：关节得能在接触力下守住位置，那就是本章的刚度。'
    source_short: '特斯拉股东更新'
  '24':
    text: '“If we really build an army of robots, I should at least have enough influence over it.”'
    source: '特斯拉 2025 年第三季度财报电话会议（36 氪英文版报道）'
    date: '2025-11-07'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://eu.36kr.com/en/p/3542648986251139'
    note: '本章挖 IMU 与状态估计。“足够的影响力”落到工程上只有一个意思：知道每台机器此刻的姿态与速度，并且知道这个知道的误差有多大。'
    source_short: '马斯克（第三方报道）'
  '28':
    text: '“Grok could organize the Optimus robots…”'
    source: '马斯克在播客里谈 xAI 与人形机器人的协同（Business Insider 综述；原文为片段）'
    date: '2026-07-24'
    speaker: 埃隆·马斯克（Tesla / xAI；人形机器人 Optimus 的公开发言者）
    kind: 英文原句，经第三方报道逐字引用；本书未核对录音或视频原文
    url: 'https://www.businessinsider.com/everything-we-know-about-teslas-optimus-humanoid-robot-2026-7'
    note: '本章讲中间件与“去 ROS 化”。“组织一群机器人”落到工程上就是话题、发现机制与时间同步——他给需求，本章给代价。'
    source_short: '马斯克（第三方报道）'
  '13':
    text: '产业整合是我们一直在做的事情。2015 年做 XDog 的时候，电机是买的，里面的电机驱动器是我自己设计的，所以成本非常低。……我们每年都会进一步，能自研的全自研。我们也有自己的工厂。'
    source: '《晚点 LatePost》对话王兴兴（问答实录），新浪财经转载'
    date: '2025-02-16'
    kind: '直接引语（问答实录，按"王兴兴："归属）'
    url: 'https://finance.sina.cn/2025-02-16/detail-ineksnuy4910269.d.html'
    note: '本章讲的是驱动板为什么会炸管——它是功率电子，不是软件。这句说明它在这家公司里是最早自研的一环（2015 年 XDog 的驱动器），也就是说：关节板的电路设计从来不是外包给别人想的。但具体到今天的死区、采样时刻、母线电容取值，官方仍然未公布 [未]。'
    source_short: 晚点 LatePost
  '17':
    text: '当然，一些特别复杂的动作，还是会遇到问题。比如动作里有很大的侧向力，或者地面比较滑，这些都会带来挑战。'
    source: '王兴兴 GTC 2026 演讲文字整理（"机器人前瞻"整理；页面自陈"在不改变原意的前提下进行了一定程度的增删修改"），腾讯新闻'
    date: '2026-03-17'
    kind: '演讲整理稿（非逐字，页面已声明增删修改）'
    url: 'https://news.qq.com/rain/a/20260317A06NCH00'
    note: '本章的判据全部建立在两个假设上：接触点只能压不能拉、摩擦是各向同性的库仑锥。他点名的正是这两个假设崩掉的两种情形——侧向力顶到摩擦锥边界，地面滑等于 μ 掉下去。厂商版"什么时候这套判据不成立"。'
    source_short: GTC 2026 整理稿
  '19':
    text: '我觉得，在全身深度强化学习上，很多核心问题其实已经基本被解决了，接下来更多是继续完善。'
    source: '王兴兴 GTC 2026 演讲文字整理（"机器人前瞻"整理；页面自陈"在不改变原意的前提下进行了一定程度的增删修改"），腾讯新闻'
    date: '2026-03-17'
    kind: '演讲整理稿（非逐字，页面已声明增删修改）'
    url: 'https://news.qq.com/rain/a/20260317A06NCH00'
    note: '这是他对"本章那堆方程还要不要人写"的判断，须按**他的判断**引用，不是事实陈述。本章的边界说法是：工业上跑的大多是离线训好的 RL 策略而非在线 WBC——这句正好是那个说法的厂商自白。'
    source_short: GTC 2026 整理稿
  '20':
    text: '机器人是一种介于3C消费电子和汽车之间的中间业态，工程量和复杂度低于汽车，并且电池本身的价值占比不大，汽车的关键技术指标是续航，机器人则不是那么在意续航，大家对于机器人最关注的还是智能化。'
    source: '周天财经对谈王兴兴（雪球嘉年华文字实录；页面自陈"为文气通顺，有适度书面化微调"），钛媒体'
    date: '2025-01-13'
    kind: '对谈实录（经书面化微调，非逐字）'
    url: 'https://www.tmtpost.com/7418531.html'
    note: '本章算的是一台机器一次抬腿要烧多少焦耳，默认"能耗是硬约束"。这句给的是相反的排序：厂商说客户不为续航买单。两头都要摆出来——第 35 章"续航不是瓶颈"与本章的焦耳账并不矛盾，但优先级确实是两回事。'
    source_short: 钛媒体·周天财经
  '27':
    text: '在王兴兴的期待中，未来人形机器人的形态，在主控大脑和四肢之间，只需用一根线缆进行连接，为了达到这一目标，仍有很多值得挖掘的工作。'
    source: '21世纪经济报道（2025 骁龙峰会·中国嘉宾对话报道），天天基金转载'
    date: '2025-09-24'
    kind: '记者转述（全句无引号、由记者以"在王兴兴的期待中"引出；原场为圆桌对话，无逐字稿可核）'
    url: 'https://fund.eastmoney.com/a/202509243522729937.html'
    note: '**这条必须按转述引用**，不能当直接引语。它给的是线束拓扑的方向：大脑与四肢之间只剩一根线缆——那就是"总线怎么选型"这句话的厂商版本。同一篇里紧邻的直接引语是"我们团队为了降低一根电线的重量，会花费很多时间和很大精力"。'
    source_short: 21世纪经济报道
  '37':
    text: '但因为整机更重，力量也更大，所以近距离接触时必须保持足够的安全距离。至少两到三米会更安全一些，否则被手臂或者腿部碰到，确实是可能受伤的。'
    source: '王兴兴 GTC 2026 演讲文字整理（"机器人前瞻"整理；页面自陈"在不改变原意的前提下进行了一定程度的增删修改"），腾讯新闻'
    date: '2026-03-17'
    kind: '演讲整理稿（非逐字，页面已声明增删修改）'
    url: 'https://news.qq.com/rain/a/20260317A06NCH00'
    note: '本章讲怎么让一台 70 公斤的机器安全地停下来。这是他唯一一次公开给出人机距离、并直接承认"可能受伤"的话——安全章节的分寸感就在这里：不是"我们的机器人很安全"，而是"它碰到你就会受伤"。'
    source_short: GTC 2026 整理稿
  '04':
    text: '其实某种意义上电机的工作原理都很类似，就跟汽车里的电机，你家的电风扇电机，包括手机上有些震动马达电机的工作原理都一样，只是说这个电机可能结构更复杂、扭矩更大、尺寸更大，再加上减速器就构成了整个关节，其实可能没有大家想得那么复杂。'
    source: '凤凰卫视《X+》专访（主持人田桐），腾讯新闻转载'
    date: '2025-02-21'
    kind: '直接引语（问答按轮次归属）'
    url: 'https://news.qq.com/rain/a/20250221A05P2500'
    note: '本章的公理是 τ = k_t·i。这句是厂商版同一件事：关节里没有魔法，只有一颗被放大的普通电机加一组减速器。（2026-10-08 调研轮：原页已逐字回读，确认此句在页面上、为王兴兴答田桐问。）'
    source_short: 凤凰卫视《X+》

  '06':
    text: '由于经费少，这个200块的双足机器人不太理想。我反思发现它的关节存在问题，于是在2013年想到用盘式无刷电机直驱的方案，电机驱动系统、机械结构和控制算法都由我一人完成。'
    source: '凤凰卫视《X+》专访（主持人田桐），腾讯新闻转载'
    date: '2025-02-21'
    kind: '直接引语（问答按轮次归属）'
    url: 'https://news.qq.com/rain/a/20250221A05P2500'
    note: '他唯一一次说清"为什么走无刷 + 直驱"，起点是 2009 年那颗关节失败的 200 元双足——正是本章"电刷是被淘汰的答案"那条路。（原页已逐字回读。）'
    source_short: 凤凰卫视《X+》

  '36':
    text: '而且大家可能想象不到，机器人不怕冷，低温没什么问题，但机器人很怕高温。不过很多情况下如果真的热了，它自己趴下休息一会就好了。……我觉得这个可能当下是有些问题，但不是个关键性的问题。'
    source: '凤凰卫视《X+》专访（主持人田桐），腾讯新闻转载'
    date: '2025-02-21'
    kind: '直接引语（问答按轮次归属）'
    url: 'https://news.qq.com/rain/a/20250221A05P2500'
    note: '两个半句都不许删：他既承认"怕高温"，又否认它是关键问题——本章要的正是这个分歧本身（额定扭矩为什么不公布）。（原页已逐字回读。）'
    source_short: 凤凰卫视《X+》
  '00':
    text: 我从小就非常喜欢科技，也非常喜欢机器人，2009年读大一的时候，我做了第一款双足人形机器人。2016年，正好有外部投资者和客户愿意购买我做出来的机器人，我就辞职出来创业了。
    source: 上海证券报《做机器人第十六年 我看到了"黎明的光"——对话宇树科技董事长王兴兴》（新浪财经转载）
    date: 2026-08-19
    kind: 直接引语（问答实录）
    url: https://finance.sina.cn/2026-08-19/detail-ininuqvc7183212.d.html
    note: 一句话交代了这本书要讲的机器是怎么开始的：先是一个人大学里做的东西，后来才成了产品。
    source_short: 上海证券报
    remapped_from: '00'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '01':
    text: 我们不浮夸，也不是PPT公司，还是比较务实，实打实的需求在哪里，我们就解决什么问题。
    source: 投中网《五年前，对王兴兴的一次未公开访谈》（新浪科技转载）
    date: 页面 2025-08-07；访谈本体约 2020 年前后
    kind: 早年访谈转写
    url: https://news.sina.cn/ai/2025-08-07/detail-infkcrwy5874615.d.html
    note: 引用时须注明是早期观点。放在"读法"这一章，是为了先说清这本书的态度：只讲能核对的东西。
    source_short: 投中网
    remapped_from: '01'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '03':
    text: 最核心的是从设计阶段就把成本降下来，比如零部件的数量尽可能少、每个零部件适合开模、模具成本尽可能低、装配时对公差的容忍度要高……
    source: 上海证券报（同上，来源 A），谈降价靠什么
    date: 2026-08-19
    kind: 直接引语
    url: https://finance.sina.cn/2026-08-19/detail-ininuqvc7183212.d.html
    note: 本章讲"便宜从哪来"，这句是厂商本人给出的可操作清单，比任何外部分析都权威。
    same_topic_alternatives:
    - Q30 价格更友好才有更多人买
    - Q31 做四足多年所以机械/成本/生产有经验
    - Q03 回应"价格屠夫"
    source_short: 上海证券报
    remapped_from: '03'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  08:
    text: 比如刚才提到的电机，我们最早那款产品用的雷卡电机，性能非常好，但后来不怎么用了。原因是我们太专注于个别技术参数……
    source: 投中网（同上，来源 B），谈选型教训
    date: 页面 2025-08-07；访谈本体约 2020 年前后
    kind: 早年访谈转写
    url: https://news.sina.cn/ai/2025-08-07/detail-infkcrwy5874615.d.html
    note: 同段另有"很多时候，不是追求个别部分的最优，而是要追求整体最优"。放在"读数精度 vs 齿轮背隙"这一章正好：**单项指标最好，不等于整机最好。**
    source_short: 投中网
    remapped_from: '07'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '14':
    text: 四足机器人是一个全新的品类，有些零部件，你想采购也买不到……
    source: 投中网（同上，来源 B）
    date: 页面 2025-08-07；访谈本体约 2020 年前后
    kind: 早年访谈转写
    url: https://news.sina.cn/ai/2025-08-07/detail-infkcrwy5874615.d.html
    note: 这是"为什么关节电机要自研"最直接的第一性理由——不是想省钱，是市场上没有。
    source_short: 投中网
    remapped_from: '05'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '15':
    text: 液压系统现在有几大问题：第一，成本非常高。另外，机械液压系统会漏油……
    source: 投中网（同上，来源 B），谈为什么选电驱不选液压
    date: 页面 2025-08-07；访谈本体约 2020 年前后
    kind: 早年访谈转写
