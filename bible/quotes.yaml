    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '16':
    text: 大家可能很难想象，有时候，我们团队为了降低一根电线的重量，会花费很多时间和很大精力。
    source: 21世纪经济报道《宇树科技王兴兴谈机器人现状：最大挑战在哪里？为什么坚持开源？》（2025 骁龙峰会·中国嘉宾对话，东方财富转载）
    date: 2025-09-25
    kind: 直接引语（圆桌发言）
    url: https://fund.eastmoney.com/a/202509243522729937.html
    note: 清点一台机器时最该记住的一句话：**克数是在这里被抠出来的**，不是在电机功率上。
    source_short: 21世纪经济报道
    remapped_from: '04'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '23':
    text: 目前整个体系不太成熟，包括机器人应该在哪里装相机、装几个、传感器数据怎么采，要不要数据传感器等问题。
    source: 界面新闻《对话宇树王兴兴：做人形机器人要克制一点，别变成传统自动化公司》
    date: 2024-08-21
    kind: 直接引语（专访）
    url: https://www.jiemian.com/article/11587971.html
    note: 厂商本人承认"传感器怎么配还没定论"。放在三种感官这一章的结尾最合适：**这本书讲的都是正在变的东西。**
    source_short: 界面新闻
    remapped_from: 09
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '30':
    text: 最大的限制门槛还是AI方面不太够，机器人AI的能力在全球范围都没有达到一个像初代ChatGPT那样的水平。
    source: 界面新闻（同上，来源 D）
    date: 2024-08-21
    kind: 直接引语（专访）
    url: https://www.jiemian.com/article/11587971.html
    note: 放在"大脑"这一章，是为了压住一种常见误读：**不是芯片不够快，是问题本身还没解决。**
    source_short: 界面新闻
    remapped_from: '11'
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '35':
    text: 对机器人来说，到目前为止，续航不是瓶颈。
    source: 投中网（同上，来源 B）
    date: 页面 2025-08-07；访谈本体约 2020 年前后
    kind: 早年访谈转写
    url: https://news.sina.cn/ai/2025-08-07/detail-infkcrwy5874615.d.html
    conflicts_with_book: '**必须并读、不可单独引用**：本章用厂商公布的 648 Wh / 20 km 算出 AS2 每公里 32.4 Wh、

      CoT ≈ 0.59，而人步行 CoT ≈ 0.34-0.37。也就是说在"每千克每公里"这一项上，电池恰恰是限制。

      这句是 2020 年前后的判断，当时的比较对象大概是液压四足与算力更弱的平台。

      本书的处理方式：**把这句放在章首，然后在本章结尾回到它**，让读者看见"一句权威的话是怎样随时间变得不再准确的"。

      '
    note: 引用时必须带"早期观点"与本章的反差说明——这比删掉它更有科普价值。
    source_short: 投中网
    remapped_from: 08
    remap_note: 2026-10-08 全书改为人形主线并重编号；本条按主题重新挂载，原文一字未改
  '02':
    text: "我觉得未必是人形。为什么现在做人形？我们只是迎合社会共识。大家现在觉得智能机器人、通用机器人就应该长得跟人一样，这是最有社会影响力的，因为人就长这样。"
    source: 《晚点 LatePost》对话王兴兴（新浪财经转载；晚点首刊 2024-05，采自 2023-10 与 2024-05 两次访谈）
    date: 2025-02-16（首刊 2024-05）
    kind: 直接引语（问答实录，回答归属明确）
    url: https://finance.sina.cn/2025-02-16/detail-ineksnuy4910269.d.html
    source_short: 晚点 LatePost
    note: "放在产品线这一章，是因为它先拆掉了本章的一个隐含前提：人形不是技术上被逼出来的唯一形态，而是被社会共识选出来的。本书后面每一处“为什么人形必须这样设计”，都要与这句并读。2026-10-08 由主控 WebFetch 回到原页复核逐字与归属。"
  '21':
    text: "如果要进一步机器人能力提升，也就是机器人 RL 的 Scaling Law，还是做得非常不好。……我训练一个机器人做新的动作、跳新的舞蹈，都要重新训练，还是从头开始训练，这是非常不好的一个事情。……因为 RL Scaling Law 在语言模型上已经是充分验证过的事情。但在机器人的运动控制上面，大家才刚刚开始。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章讲强化学习运控这道工序，这句正好说出它的成本：每换一个动作就重头训。省略号表示原文中间有口语重复，未改写。"
  '22':
    text: "你无论用各种的方法去采集数据或什么，你真正放到机器人上，它跟实物机器人偏差还是非常大。"
    source: 新浪科技／和讯《首发对话实录｜王兴兴，聊宇树科技上市》（2025 WRC 现场采访）
    date: 2025-08-09
    kind: 口语采访逐字（只截引这一整句）
    url: https://m.hexun.com/tech/2025-08-09/220818502.html
    source_short: 新浪科技／和讯
    note: "原话句子很碎，禁止把几个碎句拼成通顺长句——这里只取语义完整的第一句。sim2real 这一章不需要一句修辞，需要一句厂商自己承认的差距。"
  '25':
    text: "是我们自己研发的，因为 3 个手指足够做绝大部分事了。另外波士顿动力最新的人形机器人也是 3 个手指的，这也从侧面说明，3 个手指基本够用。"
    source: 《晚点 LatePost》对话王兴兴（新浪转载）
    date: 2025-02-16（首刊 2024-05）
    kind: 直接引语（问答实录）
    url: https://finance.sina.cn/2025-02-16/detail-ineksnuy4910269.d.html
    source_short: 晚点 LatePost
    note: "问的是“为什么只有 3 根指头”。本章讲灵巧手，这句给的是一个设计取舍的理由，不是性能承诺；引用时保留“从侧面说明”这个弱断言口径。"
  '26':
    text: "在人形机器人上，或者在移动机器人本体上，其实没办法直接部署大规模的算力。它的尺寸只有这么大，它的电池只有这么大，它部署算力的功耗是有限制的。我个人感觉在人形机器人上，最多只能部署峰值功耗为 100 瓦的算力，平时工作的时候算力只有小几十瓦，简单说就只有大概几个手机的算力水平。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章的整条内存墙推算（12 GB ÷ 带宽 = 120 ms ⇒ ≤ 8.3 Hz）正好落在他说的“100 瓦”这个天花板里。注意“我个人感觉”是他自己的限定语，引用时不许删。"
  '29':
    text: "对于具身智能和机器人来说，模型架构都还不够好，也不够统一。……但是在具身智能，在机器人领域，大家可以发现，很多情况下有了数据，会发现这个数据用不起来。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章从模仿学习讲到流匹配，这句是厂商本人对“为什么还没有统一架构”的表态；与第 33 章那句“最大问题反而是模型不是数据”同场，两条都要引，不许只留一条。"
  '31':
    text: "机器人干活的时候，我们希望其通信延迟比较低的，如果在北京干活的机器，数据中心在上海或者在内蒙，延迟实在是太大了。……未来在工业领域大规模运用人形机器人时，工厂里面可以有个分布式的服务器，所有的机器人直接连接工厂里的局部服务器就好了。服务器的安全性、通信延迟是可以接受的。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章算的是延迟预算，这句给的是他对部署形态的判断（局部服务器而非中心云）。是他 2025-08 的观点，不是已落地事实，引用时带日期。"
  '32':
    text: "后来 MIT 搞了一个开源方案，国内很多机器人基本都用这个方案。那个开源方案用的电机跟我的 XDog 用的电机一模一样。2016 年的时候，一个 MIT 的博士还找我要过硕士论文。"
    source: 《晚点 LatePost》对话王兴兴（新浪转载）
    date: 2025-02-16（首刊 2024-05）
    kind: 直接引语（问答实录）
    url: https://finance.sina.cn/2025-02-16/detail-ineksnuy4910269.d.html
    source_short: 晚点 LatePost
    note: "本章讲 UnifoLM 与开源生态，这句是开源这条路的起点史料。注意“国内很多基本都用”是他的口头量词，不许写成百分比。"
  '33':
    text: "目前，具身智能不够用的问题，究竟是模型还是数据导致的？我反而感觉目前全球范围内，大家对机器人数据这个问题的关注度有点太高了。现在最大的问题是反而是模型的问题，并不是数据问题。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字（“是反而是”为实录原文重复字，保留）
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章整章在给数据算账，而他说数据被关注过头——这两件事必须并排放在读者面前，不许把这句删掉或改写成“数据也很重要”。本书只记录他的判断，不替他圆。"
  '34':
    text: "我可以控制一个视频生成模型……让这个视频生成模型直接去驱动一个机器人完成任务。……我们用一个预训练的视频生成模型，重新训练了一下，让他先去生成一个机器人动作的视频，然后再控制一个机器人去做，这个技术是能实现的。……我觉得这个路线的方向可能会比 VLA 模型发展得要快，收敛概率还更大。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章结论是“世界模型目前只解决数据与评测两件事”，这句是他自己给出的第三条主张（用视频模型驱动控制）——比本书结论更激进，按厂商自陈 [厂] 处理，并注明尚无公开可复现结果。"
  '38':
    text: "我们希望人形机器人本体的各方面功能更加完善后再考虑商业化落地的问题。对于商业落地的方向规划，我们不一定会 all in 工业，也可能会推进在教育、科研等领域的商业化进程，我们对人形机器人落地方向持更加开放的态度。"
    source: 《中国电子报》“人形机器人高质量发展”系列访谈（腾讯新闻转载）
    date: 采访 2024-08-20；转载 2025-02-18
    kind: 直接引语（记者以“王兴兴回应表示”引出）
    url: https://news.qq.com/rain/a/20250218A03XNJ00
    source_short: 中国电子报
    note: "本章讲“演示很惊艳、连续作业很难”，这句是厂商本人对“为什么不急着进工厂”的说法——与本章 p^N 那条算术是同一件事的两种表述：一个是能力判断，一个是商业选择。引用时带 2024-08 的日期，因为 2026 年的口径已经变了。"
  '39':
    text: "在 AI 领域，没有一家大公司能保证，只要有足够的人、有足够的资源，我就能永远领先。OpenAI 和 DeepSeek 已经证明了，AI 的创新永远伴随着一些随机性，伴随着更多的聪明年轻人的。"
    source: 王兴兴 2025 世界机器人大会主旨演讲（新浪“机器人前瞻”文字实录）
    date: 2025-08-09
    kind: 第一人称演讲逐字
    url: https://k.sina.cn/article_7950358917_1d9e0d98501901bnhc.html
    source_short: WRC 2025 演讲实录
    note: "本章讲分工与人才，这句给的是“为什么这一行的位置没有被大厂占死”的一句话版本，正好接在六层拥挤度那张表前面。"
  '40':
    text: "我觉得主要是你足够专注。你 24 小时一直在思考这个问题，我不信这个问题是解决不了的。"
    source: 《晚点 LatePost》对话王兴兴（新浪转载）
    date: 2025-02-16（首刊 2024-05）
    kind: 直接引语（问答实录）
    url: https://finance.sina.cn/2025-02-16/detail-ineksnuy4910269.d.html
    source_short: 晚点 LatePost
    note: "放在行动计划这一章，但本章的立场是“给路线不给承诺”：这句只作为一个人做事方式的自述出现，不许被读成“专注就能学会”。"
