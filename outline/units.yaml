  - unit: "40"
    part: "尾声"
    title: 一个工程师的十二个月：把这本书变成作品集
    zoom: epilogue
    gate_critical: true
    code: pseudo
    needs_measure: true
    purpose: 把六层地图变成可验收的个人路线：每一层一个"能跑、能录像、能被别人复现"的产物
    dig:
      stack: 全书六层 → 六件作品
      mechanism: 一颗会听话的关节 → 一条 1 kHz 实时链路 → 一个恒力按压 → 一份时延报告 → 一个数据集 → 一次微调评测
      base: 每层的验收都是一个可测量（力矩误差 ≤5% FS、周期抖动 <50 µs、未见条件成功率 ≥70%）
      boundary: 预算、时间、学校资源因人而异；本书给路线不给承诺
    anchor_number: 约 ¥3 万元可落地的练手整机配置 [查]
