# ⚠️ 已归档（2026-10-07 定位调整）
# 这一版是"开发者工作流手册"的 50 章大纲。作者把本书重新定位为**科普 + 技术爱好者**
# （少代码、第一性原理、整体→局部→底层、幽默风趣），现行大纲见 outline/units.yaml。
# 本文件保留不删，因为它的第 2/3/5/6/7 篇与附录 A1-A4 仍是现行大纲第 4 部（技术追问层）
# 与附录 D 的素材来源；话题全表与兼容矩阵这两张表也仍然要做，只是降级为"给想深究的人"。
# 若将来出第二本（开发者手册），从这里续。

# outline/units.yaml — 《宇树机器人开发者工作流全栈》Phase 2 大纲
#
# schema: book-factory/templates/chapter-entry.yaml § TECHNICAL
# 状态：Phase 2 草稿，待 Phase 1.5（knowledge-graph）完成后补
#   concepts_introduced / concepts_used(introduced_in) / examples / exercises / forward_references
# 依赖顺序校验（introduced_in 必须早于本单元）在那一步跑。
#
# 本文件额外使用两个自定义字段（供构建与核查排期用，不影响 skill 读取）：
#   layer:            about | using | reference | summary   —— Inside Macintosh 四层归属
#   live_check:       true 表示本章含"只有真机才能定"的论断，必须挂 verification/ 核查单
#   requires_edu:     true 表示低层/EDU 权限，AIR/PRO 读者需跳读替代节
#
# unit 编号是读者阅读顺序，也是 drafts/unit-NN/ 的稳定 id。
# 机型缩写：G2=Go2(AIR/PRO/EDU) G1=G1 H1=H1/H1_2 H2=H2 B2=B2/B2W AS2=AS2 Z1=Z1 A1=A1/Go1(历史栈)

units:

  # ===================== 第 0 篇 序与路线图 =====================
  - unit: "00"
    title: 前言：这本书的范围、版本基线与非官方声明
    part: "第 0 篇 序与路线图"
    layer: about
    gate_critical: true          # 开篇单元，缺陷最贵
    live_check: false
    purpose: 读者能说出这本书讲哪层、钉在哪个版本、以及自己手上哪台机器在覆盖范围内
    risks: [误以为这是官方文档, 误以为覆盖所有机型所有固件]
    target_words: 2500

  - unit: "01"
    title: 四条读者路线图
    part: "第 0 篇 序与路线图"
    layer: about
    gate_critical: true
    live_check: false
    purpose: 四类入口读者（发指令的 / 训策略的 / 做产品的 / 开实验课的）各自知道该读哪 6-8 章、可跳哪些
    risks: [线性通读导致在低层章节卡死]
    target_words: 2000

  - unit: "02"
    title: 全栈架构图：从电机换算是多少转到 App 按一下按钮
    part: "第 0 篇 序与路线图"
    layer: about
    gate_critical: true          # 全书唯一"地图"，错了全书错位
    live_check: false
    purpose: 读者能画出六层栈（电机总线→DDS→SDK→ROS2/仿真→策略→应用）并指出任一功能落在哪层
    risks: [把 sport_client 与 rt/lowcmd 当成同一层, 以为 ROS2 是必需环节]
    target_words: 3500

  # ===================== 第 1 篇 概念层（About） =====================
  - unit: "03"
    title: About 通信：DDS 域、Participant、Topic 与 IDL
    part: "第 1 篇 概念层"
    layer: about
    gate_critical: true
    live_check: false
    purpose: 读者能解释"为什么宇树两侧连接都收敛成 DDS 话题"、请求/应答与高频状态两条路的区别、以及域号/PARTICIPANT_NAME 为何是第一个坑
    risks: [把 DDS 当成 ROS2 的替身, 以为 topic 名字会随 SDK 版本稳定]
    target_words: 4000

  - unit: "04"
    title: About 控制面：高层运控、低层关节与电机总线三级权限
    part: "第 1 篇 概念层"
    layer: about
    gate_critical: true          # 空白论证第 3 项，判定链必须准确
    live_check: true
    requires_edu: true
    purpose: 读者能判断"我这个机型+固件+当前运动模式下，能不能拿到 rt/lowcmd"，并知道被谁挡住（EDU 授权 / MCF / App 运动模式 / MotionSwitcher）
    risks: [以为 AIR/PRO 也能直接发 lowcmd, 不知道抢占会互相踢]
    target_words: 4500

  - unit: "05"
    title: About 机型与档位：同一套 SDK 为什么行为不同
    part: "第 1 篇 概念层"
    layer: about
    gate_critical: true
    live_check: false
    purpose: 读者能为 G2/G1/H1/H2/B2/AS2/Z1/A1 各自指出 IDL 命名空间、控制接口代次、可用传感器与文档入口
    risks: [混用 unitree_go 与 unitree_hg 的 IDL, 用 Go2 的示例套 G1]
    target_words: 4000

  - unit: "06"
    title: About 仿真与 sim2real：三条线各自解决什么
    part: "第 1 篇 概念层"
    layer: about
    gate_critical: false
    live_check: false
    purpose: 读者能选对仿真器（MuJoCo 快速验证接口 / Isaac Lab 训练与采集 / 旧 Isaac Gym 的历史项目）并解释"同参数同结果"为什么是硬要求
    risks: [以为仿真训完直接上真机, 忽视 unitree_sim_isaaclab 与真机共用话题]
    target_words: 3500

  - unit: "07"
    title: About 感知栈：雷达、深度相机、里程计与坐标系约定
    part: "第 1 篇 概念层"
    layer: about
    gate_critical: true          # 坐标系错了整链皆错
    live_check: false
    purpose: 读者能说清 L1/L2、Go2 自带 utlidar、robot_odom 各自的原点/轴向/单位，以及为什么同一份点云在不同文档里轴向不一致
    risks: [坐标系约定不统一导致 LIO 发散, 把 utlidar 与 unilidar 当成同一个东西]
    target_words: 3500

  - unit: "08"
    title: About 操作栈：遥操作→数据→模仿学习→部署
    part: "第 1 篇 概念层"
    layer: about
    gate_critical: false
    live_check: false
    purpose: 读者能描述 xr_teleoperate / sim_isaaclab / unitree_lerobot / unifolm 在一条链上的位置与数据格式交接点
    risks: [以为遥操作数据可直接喂任意策略]
    target_words: 3000

  # ===================== 第 2 篇 上手（Using） =====================
  - unit: "09"
    title: Using 环境：Ubuntu/gcc/CMake、cyclonedds 0.10.2 与那个不能 source 的坑
    part: "第 2 篇 上手"
    layer: using
    gate_critical: true          # 全书第一道墙，失败率最高
    live_check: true
    purpose: 读者能在 30 分钟内得到一个"能收发宇树话题"的环境，并知道 Windows/WSL2/conda 三条路的代价
    risks: [编译 cyclonedds 时终端已 source ROS2, pip 装 SDK 前没设 CYCLONEDDS_HOME, 版本装成 0.10.5]
    target_words: 5000

  - unit: "10"
    title: Using 第一个订阅：收到 rt/sportmodestate
    part: "第 2 篇 上手"
    layer: using
    gate_critical: true
    live_check: true
    purpose: 读者能跑通 C++ 与 Python 各一个订阅程序，打印真实字段，并用 IDL 源码核对字段含义
    risks: [队列长度与回调阻塞, 以为字段单位是 SI]
    target_words: 4500

  - unit: "11"
    title: Using 安全前置：急停、吊架、App 抢端口与电池
    part: "第 2 篇 上手"
    layer: using
    gate_critical: true          # 安全单元，必须零错误
    live_check: true
    purpose: 读者在第一次发运动指令前完成物理与软件两侧的安全准备，并知道出错时的现场处置顺序
    risks: [手机 App 占着 Wi-Fi 端口, 低层无速度/位置限幅直接上, 无人值守]
    target_words: 3500

  - unit: "12"
    title: Using 第一次让它动：sport_client 与 MotionSwitcher 抢占
    part: "第 2 篇 上手"
    layer: using
    gate_critical: false
    live_check: true
    requires_edu: false
    purpose: 读者能列出当前可用运动模式、发起一次受控指令、并在被其他控制器抢占时正确恢复
    risks: [不知道 MotionSwitcher 会拒绝, 指令无应答时反复重发]
    target_words: 4000

  - unit: "13"
    title: Using ROS2 桥：unitree_ros2 的消息、cyclonedds_ws 与话题映射
    part: "第 2 篇 上手"
    layer: using
    gate_critical: false
    live_check: true
    purpose: 读者能在 ROS2 Humble 下拿到与原生 SDK 等价的话题，并解释官方为何没有 ros2_control 硬件接口层
    risks: [foxy 必须自编译而 humble 不必, rmw 实现串味]
    target_words: 4500

  - unit: "14"
    title: Using 仿真里跑同一段代码：unitree_mujoco（MuJoCo 3.3.6）
    part: "第 2 篇 上手"
    layer: using
    gate_critical: false
    live_check: false
    purpose: 读者能用同一份客户端代码在仿真与真机之间切换，并理解这为什么是"契约一致"的证明
    risks: [依赖 Boost/Spdlog/yaml-cpp/GLFW 装不上, 仿真与真机话题不同名]
    target_words: 4000

  - unit: "15"
    title: Using 排障手册：上手阶段会撞的 12 件事
    part: "第 2 篇 上手"
    layer: summary
    gate_critical: false
    live_check: true
    purpose: 读者能用手查表定位"收不到任何消息 / 只收到一半 / 发出去不动 / 仿真能认真机不能"这四类症状
    risks: [症状描述与根因不匹配]
    target_words: 3500

