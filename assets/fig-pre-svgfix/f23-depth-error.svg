<text x="716" y="256" class="m" fill="#a52020" font-size="16">   = 27 倍噪声</text>
<text x="110" y="356" class="tiny">读法：50 cm 处能分辨 3 mm（够抓杯子）；4 m 处误差 20 cm（判断不了远处物体）。所以相机与雷达不是冗余，是互补的两个方向。</text>
