<text x="700" y="100" class="t" font-size="18">③ 转子转速（惯量再积分一次）</text>
<text x="700" y="276" class="s" fill="#1d6b3a">几乎看不到开关</text>
<text x="60" y="340" class="m">τ_e = L/R（零点几毫秒）　→　τ_m = J·R/k_t²（几毫秒）　→　角度再积分一次（几十毫秒起）</text>
<text x="60" y="368" class="s">每一级都比上一级慢 10–100 倍。所以「平均」不是近似技巧，是这台机器本身的结构。</text>
