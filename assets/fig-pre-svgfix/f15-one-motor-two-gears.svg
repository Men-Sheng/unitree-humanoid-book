<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#111">
<style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}.m{font-family:'Cascadia Mono','Consolas',monospace;font-size:17px}.s{font-size:16px;fill:#666}.t{font-size:21px;font-weight:600}.h{font-size:23px;font-weight:700}.tiny{font-size:14px;fill:#666}line,path,rect,circle,polygon{vector-effect:non-scaling-stroke}</style>
<rect x="60" y="90" width="250" height="120" rx="6" fill="#f3f8fd" stroke="#1a4f8a" stroke-width="2"/>
<text x="80" y="122" class="h">N7520 电机</text>
<text x="80" y="148" class="m" font-size="16">rotor 惯量 0.489e-4 kg·m²</text>
<text x="80" y="170" class="m" fill="#a52020" font-size="16">满扭矩转子侧 ≈ 6.16 N·m</text>
<text x="80" y="192" class="tiny" fill="#666">（φ75 × 叠厚 20 mm）</text>
<rect x="400" y="88" width="170" height="78" rx="6" fill="#f4faf6" stroke="#1d6b3a" stroke-width="2"/>
<text x="485" y="120" class="t" fill="#1d6b3a" text-anchor="middle" font-size="18">减速 14.3 : 1</text>
<text x="485" y="146" class="m" fill="#1d6b3a" text-anchor="middle">输出 88 N·m</text>
<line x1="310" y1="150" x2="400" y2="127" stroke="#1a4f8a" stroke-width="2"/>
<line x1="400" y1="127" x2="391.9" y2="134.4" stroke="#1a4f8a" stroke-width="2"/>
<line x1="400" y1="127" x2="389.3" y2="124.4" stroke="#1a4f8a" stroke-width="2"/>
<text x="600" y="133" class="s">髋俯仰 · 髋偏航 · 腰偏航</text>
<line x1="570" y1="127" x2="596" y2="127" stroke="#666" stroke-width="1.5"/>
<rect x="400" y="178" width="170" height="78" rx="6" fill="#f4faf6" stroke="#1d6b3a" stroke-width="2"/>
<text x="485" y="210" class="t" fill="#1d6b3a" text-anchor="middle" font-size="18">减速 22.5 : 1</text>
<text x="485" y="236" class="m" fill="#1d6b3a" text-anchor="middle">输出 139 N·m</text>
<line x1="310" y1="150" x2="400" y2="217" stroke="#1a4f8a" stroke-width="2"/>
<line x1="400" y1="217" x2="389.1" y2="215.3" stroke="#1a4f8a" stroke-width="2"/>
<line x1="400" y1="217" x2="395.3" y2="207.1" stroke="#1a4f8a" stroke-width="2"/>
<text x="600" y="223" class="s">髋侧摆 · 膝</text>
<line x1="570" y1="217" x2="596" y2="217" stroke="#666" stroke-width="1.5"/>
<rect x="640" y="250" width="320" height="110" rx="6" fill="#fdf6f6" stroke="#a52020" stroke-width="2"/>
<text x="656" y="278" class="t" fill="#a52020" font-size="18">反推回转子侧：</text>
<text x="656" y="306" class="m">88 ÷ 14.3 = 6.15 N·m</text>
<text x="656" y="330" class="m" fill="#a52020">139 ÷ 22.5 = 6.18 N·m　→ 差 0.4%</text>
<line x1="485" y1="256" x2="640" y2="300" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="640" y1="300" x2="629.2" y2="302.3" stroke="#666" stroke-width="1.5"/>
<line x1="640" y1="300" x2="632.1" y2="292.4" stroke="#666" stroke-width="1.5"/>
<text x="60" y="250" class="s">型号名里那个数字就是减速比。两档输出差 58%，</text>
<text x="60" y="274" class="s">而差异全部来自一级齿轮——电机是同一颗。</text>
<text x="60" y="320" class="s">另外两档：N5020-16 → 25 N·m（肩/肘/腕滚/踝），</text>
<text x="60" y="344" class="s">　　　　W4010-25 → 5 N·m（腕俯仰/偏航）。</text>
<text x="60" y="382" class="t" font-size="18">手腕只有 5 N·m：它不需要扛重量，只需要把掌摆到该在的朝向。</text>
</svg>