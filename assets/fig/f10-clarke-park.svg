<text x="60" y="440" class="m" font-size="17">i_d = i_α cosθ + i_β sinθ　（沿磁钢，不产生扭矩）</text>
<text x="60" y="466" class="m" font-size="17">i_q = −i_α sinθ + i_β cosθ　（垂直磁钢，全部做功）</text>
<text x="60" y="496" class="t" fill="#a52020" font-size="18">τ = (3/2)·p·λ_m·i_q　⇒　要多少扭矩，就给多少 i_q</text>
