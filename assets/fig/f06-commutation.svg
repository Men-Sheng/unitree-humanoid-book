<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 0.0 1000.0 402.3" width="100%" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#111">
<style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}.m{font-family:'Cascadia Mono','Consolas',monospace;font-size:17px}.s{font-size:16px;fill:#666}.t{font-size:21px;font-weight:600}.h{font-size:23px;font-weight:700}.tiny{font-size:14px;fill:#666}line,path,rect,circle,polygon{vector-effect:non-scaling-stroke}</style>
<text x="30" y="30" class="s">同一件事（维持定子场与转子场正交）的两种做法</text>
<circle cx="200" cy="200" r="80" fill="none" stroke="#666" stroke-width="2"/>
<line x1="268.0" y1="200.0" x2="280.0" y2="200.0" stroke="#666" stroke-width="1.5"/>
<line x1="248.08326112068522" y1="151.91673887931478" x2="256.5685424949238" y2="143.4314575050762" stroke="#666" stroke-width="1.5"/>
<line x1="200.0" y1="132.0" x2="200.0" y2="120.0" stroke="#666" stroke-width="1.5"/>
<line x1="151.91673887931478" y1="151.91673887931478" x2="143.4314575050762" y2="143.4314575050762" stroke="#666" stroke-width="1.5"/>
<line x1="132.0" y1="200.0" x2="120.0" y2="200.0" stroke="#666" stroke-width="1.5"/>
<line x1="151.91673887931475" y1="248.08326112068522" x2="143.4314575050762" y2="256.5685424949238" stroke="#666" stroke-width="1.5"/>
<line x1="200.0" y1="268.0" x2="199.99999999999997" y2="280.0" stroke="#666" stroke-width="1.5"/>
<line x1="248.08326112068522" y1="248.08326112068525" x2="256.5685424949238" y2="256.5685424949238" stroke="#666" stroke-width="1.5"/>
<line x1="144.0" y1="200" x2="256.0" y2="200" stroke="#1a4f8a" stroke-width="3"/>
<line x1="256.0" y1="200" x2="246.3" y2="205.2" stroke="#1a4f8a" stroke-width="3"/>
<line x1="256.0" y1="200" x2="246.3" y2="194.8" stroke="#1a4f8a" stroke-width="3"/>
<text x="200" y="106" class="tiny" fill="#1a4f8a" text-anchor="middle">定子磁场（永磁，固定）</text>
<line x1="200" y1="248.0" x2="240" y2="160" stroke="#a52020" stroke-width="3"/>
<line x1="240" y1="160" x2="240.7" y2="171.0" stroke="#a52020" stroke-width="3"/>
<line x1="240" y1="160" x2="231.3" y2="166.7" stroke="#a52020" stroke-width="3"/>
<text x="246" y="156" class="tiny" fill="#a52020">转子磁矩 m</text>
<rect x="96" y="296" width="210" height="46" rx="6" fill="#fdf6f6" stroke="#a52020" stroke-width="2"/>
<text x="201" y="316" class="t" fill="#a52020" text-anchor="middle" font-size="18">换向器 + 碳刷</text>
<text x="201" y="334" class="tiny" fill="#a52020" text-anchor="middle">每转一圈撞一次自己</text>
<text x="60" y="366" class="tiny">优点：不需要知道角度——它的位置就是转子的位置，物理耦合。</text>
<circle cx="640" cy="200" r="80" fill="none" stroke="#666" stroke-width="2"/>
<line x1="572.0" y1="200.0" x2="708.0" y2="200.0" stroke="#1a4f8a" stroke-width="1.6"/>
<line x1="674.0" y1="258.88972745734185" x2="606.0" y2="141.11027254265815" stroke="#1a4f8a" stroke-width="1.6"/>
<line x1="674.0" y1="141.11027254265818" x2="606.0" y2="258.8897274573418" stroke="#1a4f8a" stroke-width="1.6"/>
<line x1="640" y1="200" x2="698" y2="154" stroke="#1d6b3a" stroke-width="3"/>
<line x1="698" y1="154" x2="693.6" y2="164.1" stroke="#1d6b3a" stroke-width="3"/>
<line x1="698" y1="154" x2="687.2" y2="156.0" stroke="#1d6b3a" stroke-width="3"/>
<text x="702" y="150" class="tiny" fill="#1d6b3a">合成矢量（软件决定）</text>
<line x1="640" y1="200" x2="620" y2="128" stroke="#a52020" stroke-width="3"/>
<line x1="620" y1="128" x2="627.6" y2="136.0" stroke="#a52020" stroke-width="3"/>
<line x1="620" y1="128" x2="617.6" y2="138.7" stroke="#a52020" stroke-width="3"/>
<text x="544" y="122" class="tiny" fill="#a52020">转子磁钢</text>
<rect x="520" y="296" width="250" height="46" rx="6" fill="#f4faf6" stroke="#1d6b3a" stroke-width="2"/>
<text x="645" y="316" class="t" fill="#1d6b3a" text-anchor="middle" font-size="18">FOC + 编码器</text>
<text x="645" y="334" class="tiny" fill="#1d6b3a" text-anchor="middle">没有磨损件，但必须知道 θ</text>
<rect x="800" y="120" width="180" height="150" rx="6" fill="#f7f7f7" stroke="#666" stroke-width="2"/>
<text x="812" y="148" class="tiny" fill="#111">θ 从编码器来</text>
<text x="812" y="174" class="tiny" fill="#666">→ 会被装配误差污染</text>
<text x="812" y="200" class="tiny" fill="#666">→ 会被齿隙误导</text>
<text x="812" y="226" class="tiny" fill="#666">→ 掉电会丢失</text>
<text x="812" y="252" class="tiny" fill="#666">→ 要产线标定</text>
<text x="60" y="388" class="t" font-size="18">无刷化的本质：把磨损件换成信息。换来的是一整类新故障——信息错。</text>
</svg>