<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" fill="#111">
<style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}.m{font-family:'Cascadia Mono','Consolas',monospace;font-size:17px}.s{font-size:16px;fill:#666}.t{font-size:21px;font-weight:600}.h{font-size:23px;font-weight:700}.tiny{font-size:14px;fill:#666}line,path,rect,circle,polygon{vector-effect:non-scaling-stroke}</style>
<text x="30" y="34" class="s">本书的挖法：从任意一层往下问“那这个又靠什么”，问到不能再问为止。下面五层是全书骨架，箭头下面的问句就是每一章</text>
<text x="30" y="58" class="s">的正文。</text>
<rect x="40" y="108" width="176" height="104" rx="6" fill="#fbf4f4" stroke="#1a4f8a" stroke-width="2"/>
<text x="128.0" y="136" class="h" text-anchor="middle">任务层</text>
<text x="128.0" y="164" class="m" text-anchor="middle">抓住那只杯子</text>
<text x="128.0" y="202" class="tiny" text-anchor="middle">刷新 1–10 Hz</text>
<line x1="217" y1="160" x2="221" y2="160" stroke="#111" stroke-width="2"/>
<line x1="221" y1="160" x2="211.3" y2="165.2" stroke="#111" stroke-width="2"/>
<line x1="221" y1="160" x2="211.3" y2="154.8" stroke="#111" stroke-width="2"/>
<rect x="222" y="108" width="176" height="104" rx="6" fill="#f4f7fb" stroke="#1a4f8a" stroke-width="2"/>
<text x="310.0" y="136" class="h" text-anchor="middle">轨迹层</text>
<text x="310.0" y="164" class="m" text-anchor="middle">手指 60 mm/s</text>
<text x="310.0" y="202" class="tiny" text-anchor="middle">刷新 50–200 Hz</text>
<line x1="399" y1="160" x2="403" y2="160" stroke="#111" stroke-width="2"/>
<line x1="403" y1="160" x2="393.3" y2="165.2" stroke="#111" stroke-width="2"/>
<line x1="403" y1="160" x2="393.3" y2="154.8" stroke="#111" stroke-width="2"/>
<rect x="404" y="108" width="176" height="104" rx="6" fill="#f4f7fb" stroke="#1a4f8a" stroke-width="2"/>
<text x="492.0" y="136" class="h" text-anchor="middle">力矩层</text>
<text x="492.0" y="164" class="m" text-anchor="middle">τ = 12 N·m</text>
<text x="492.0" y="202" class="tiny" text-anchor="middle">刷新 1 kHz</text>
<line x1="581" y1="160" x2="585" y2="160" stroke="#111" stroke-width="2"/>
<line x1="585" y1="160" x2="575.3" y2="165.2" stroke="#111" stroke-width="2"/>
<line x1="585" y1="160" x2="575.3" y2="154.8" stroke="#111" stroke-width="2"/>
<rect x="586" y="108" width="176" height="104" rx="6" fill="#f4f7fb" stroke="#1a4f8a" stroke-width="2"/>
<text x="674.0" y="136" class="h" text-anchor="middle">电流层</text>
<text x="674.0" y="164" class="m" text-anchor="middle">i_q = 18.8 A</text>
<text x="674.0" y="202" class="tiny" text-anchor="middle">刷新 10–20 kHz</text>
<line x1="763" y1="160" x2="767" y2="160" stroke="#111" stroke-width="2"/>
<line x1="767" y1="160" x2="757.3" y2="165.2" stroke="#111" stroke-width="2"/>
<line x1="767" y1="160" x2="757.3" y2="154.8" stroke="#111" stroke-width="2"/>
<rect x="768" y="108" width="176" height="104" rx="6" fill="#f4f7fb" stroke="#a52020" stroke-width="2"/>
<text x="856.0" y="136" class="h" text-anchor="middle">器件层</text>
<text x="856.0" y="164" class="m" text-anchor="middle">高侧管导通</text>
<text x="856.0" y="184" class="m" text-anchor="middle">37 %</text>
<text x="856.0" y="202" class="tiny" text-anchor="middle">刷新 40 kHz PWM</text>
<text x="135.0" y="246" class="s" fill="#a52020" text-anchor="middle">那『抓』靠什么</text>
<line x1="135.0" y1="256" x2="135.0" y2="278" stroke="#a52020" stroke-width="1" stroke-dasharray="4 4"/>
<text x="135.0" y="300" class="s" text-anchor="middle">靠关节把扭矩送到</text>
<text x="135.0" y="322" class="s" text-anchor="middle">指腹，不是靠</text>
<text x="135.0" y="344" class="s" text-anchor="middle">“用力”这个字</text>
<text x="317.0" y="246" class="s" fill="#a52020" text-anchor="middle">轨迹靠什么执行</text>
<line x1="317.0" y1="256" x2="317.0" y2="278" stroke="#a52020" stroke-width="1" stroke-dasharray="4 4"/>
<text x="317.0" y="300" class="s" text-anchor="middle">靠每个关节给一条</text>
<text x="317.0" y="322" class="s" text-anchor="middle">扭矩指令，</text>
<text x="317.0" y="344" class="s" text-anchor="middle">不是给位置</text>
<text x="499.0" y="246" class="s" fill="#a52020" text-anchor="middle">12 N·m 靠什么</text>
<line x1="499.0" y1="256" x2="499.0" y2="278" stroke="#a52020" stroke-width="1" stroke-dasharray="4 4"/>
<text x="499.0" y="300" class="s" text-anchor="middle">靠垂直于转子的</text>
<text x="499.0" y="322" class="s" text-anchor="middle">磁场：τ = k_t·i_q</text>
<text x="499.0" y="344" class="s" text-anchor="middle">（第 05、11 章）</text>
<text x="681.0" y="246" class="s" fill="#a52020" text-anchor="middle">电流谁来调</text>
<line x1="681.0" y1="256" x2="681.0" y2="278" stroke="#a52020" stroke-width="1" stroke-dasharray="4 4"/>
<text x="681.0" y="300" class="s" text-anchor="middle">靠改 MOSFET 导通</text>
<text x="681.0" y="322" class="s" text-anchor="middle">时间：伏秒平衡</text>
<text x="681.0" y="344" class="s" text-anchor="middle">（第 08 章）</text>
<line x1="40" y1="386" x2="960" y2="386" stroke="#ddd" stroke-width="2"/>
<text x="40" y="414" class="t">问到底的四块地砖（全书所有推算最终落在这里）：</text>
<text x="40" y="444" class="s">· τ = k_t·i　洛伦兹力 F = B·I·ℓ，力臂换成扭矩</text>
<text x="510" y="444" class="s">· τ = m × B　只有垂直分量出力，sinθ 定大小与方向</text>
<text x="40" y="470" class="s">· 伏秒平衡　改导通时间 = 改平均电压 = 合成任意矢量</text>
<text x="510" y="470" class="s">· 香农 / 奈奎斯特　信息与控制带宽的下限，省不掉</text>
</svg>