<text x="716" y="108" class="t" fill="#1a4f8a">为什么必须融合</text>
<text x="716" y="136" class="m" font-size="16">陀螺：几秒内很准</text>
<text x="716" y="160" class="m" font-size="16">　　 但误差线性累积</text>
<text x="716" y="184" class="m" font-size="16">加速度计：几十秒后仍准</text>
<text x="716" y="208" class="m" font-size="16">　　 但只在静止时能定「竖直」</text>
<text x="716" y="232" class="m" font-size="16">⇒ 频段互补</text>
<text x="716" y="256" class="m" font-size="16">⇒ 卡尔曼不是加分项</text>
<text x="110" y="356" class="tiny">宇树只公布字段与「双 IMU」结构；型号、零偏稳定性、整机 IMU 采样率全部未公布 [未]。所以这一张图给的是判据，不是它的指标。</text>
