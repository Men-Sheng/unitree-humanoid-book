<text x="576" y="116" class="s">一条流水线一小时 ≈ 60–120 次动作。</text>
<text x="576" y="140" class="t" fill="#a52020" font-size="15.48" style="font-size: 13.31px;">「95% 成功率」= 每小时必然出错一次以上。</text>
<text x="110" y="380" class="s">若要求 1000 次动作整体成功 90%，需要单次 99.99%——那不是模型能力，是系统工程。</text>
